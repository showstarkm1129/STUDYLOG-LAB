    <g text-anchor="middle" font-size="14" fill="#65716a"><text x="175" y="319">授業・課題・記録をひとつに。</text><text x="175" y="342">用途が直感的に伝わる案。</text><text x="480" y="319">Study と Log をつなぐ軌跡。</text><text x="480" y="342">小ささと独自性を優先する案。</text><text x="785" y="319">学びから生まれる発見。</text><text x="785" y="342">LABらしい好奇心を表す案。</text></g>
